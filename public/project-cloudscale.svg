<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="650" y1="0" x2="650" y2="500" />
    <line x1="750" y1="0" x2="750" y2="500" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Window Header -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0b1120" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="6" fill="#ef4444" />
  <circle cx="92" cy="70" r="6" fill="#f59e0b" />
  <circle cx="114" cy="70" r="6" fill="#10b981" />
  <rect x="150" y="60" width="280" height="20" rx="6" fill="rgba(255,255,255,0.06)" />
  <text x="165" y="74" fill="#94a3b8" font-family="monospace" font-size="11">telemetry.cloudscale.io/live-stream</text>

  <!-- Metrics Cards Inside Mockup -->
  <rect x="70" y="110" width="190" height="85" rx="8" fill="rgba(30,41,59,0.7)" stroke="rgba(99,102,241,0.3)"/>
  <text x="85" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12">INGESTION RATE</text>
  <text x="85" y="170" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="24">52,480 <tspan font-size="13" font-weight="normal">req/s</tspan></text>

  <rect x="280" y="110" width="190" height="85" rx="8" fill="rgba(30,41,59,0.7)" stroke="rgba(168,85,247,0.3)"/>
  <text x="295" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12">AVG LATENCY (P99)</text>
  <text x="295" y="170" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="24">12.4 <tspan font-size="13" font-weight="normal">ms</tspan></text>

  <rect x="490" y="110" width="240" height="85" rx="8" fill="rgba(30,41,59,0.7)" stroke="rgba(16,185,129,0.3)"/>
  <text x="505" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12">CLUSTER HEALTH</text>
  <text x="505" y="170" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="24">99.998% <tspan font-size="13" font-weight="normal">Nominal</tspan></text>

  <!-- Chart Visualizer -->
  <rect x="70" y="215" width="660" height="215" rx="8" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.08)"/>
  <!-- Chart Line -->
  <path d="M 90 380 Q 150 340 210 360 T 330 300 T 450 270 T 570 240 T 700 250" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>
  <path d="M 90 380 Q 150 340 210 360 T 330 300 T 450 270 T 570 240 T 700 250 L 700 410 L 90 410 Z" fill="url(#accent)" opacity="0.12"/>

  <!-- Trace Nodes -->
  <circle cx="210" cy="360" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="2"/>
  <circle cx="330" cy="300" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="450" cy="270" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
  <circle cx="570" cy="240" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
</svg>
