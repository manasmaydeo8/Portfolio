<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pulseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#pulseBg)" rx="16"/>
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#121215" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="6" fill="#ef4444" />
  <circle cx="92" cy="70" r="6" fill="#f59e0b" />
  <circle cx="114" cy="70" r="6" fill="#10b981" />
  <text x="140" y="74" fill="#94a3b8" font-family="sans-serif" font-size="12">PulseChat — Peer-to-Peer Mesh Audio &amp; Interactive Canvas</text>

