  <text x="565" y="140" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="12">● LIVE VOICE CHANNEL</text>
  
  <rect x="565" y="160" width="150" height="40" rx="6" fill="#27272a"/>
