    <rect x="252" y="20" width="22" height="210" fill="url(#barGrad)" rx="3"/>
    <line x1="263" y1="10" x2="263" y2="250" stroke="#10b981" stroke-width="1.5"/>

    <!-- Order Book Mini Widget -->
    <rect x="330" y="0" width="330" height="240" rx="8" fill="rgba(30,41,59,0.5)" stroke="rgba(255,255,255,0.06)"/>
    <text x="350" y="30" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="12">REAL-TIME DEPTH CHART (L2)</text>
    <line x1="350" y1="45" x2="640" y2="45" stroke="rgba(255,255,255,0.05)"/>
    <text x="350" y="75" fill="#10b981" font-family="monospace" font-size="13">BIDS: $68,420.00  |  14.22 BTC</text>
    <text x="350" y="105" fill="#10b981" font-family="monospace" font-size="13">BIDS: $68,418.50  |  28.90 BTC</text>
    <text x="350" y="135" fill="#ef4444" font-family="monospace" font-size="13">ASKS: $68,422.00  |  19.14 BTC</text>
    <text x="350" y="165" fill="#ef4444" font-family="monospace" font-size="13">ASKS: $68,425.50  |  34.02 BTC</text>
    <rect x="350" y="190" width="290" height="25" rx="4" fill="rgba(99,102,241,0.2)"/>
    <text x="360" y="207" fill="#818cf8" font-family="sans-serif" font-size="11">Rendering at locked 60 FPS via Canvas &amp; WebGL</text>
