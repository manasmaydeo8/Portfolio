    <line x1="47" y1="70" x2="47" y2="245" stroke="#10b981" stroke-width="1.5"/>

    <rect x="72" y="140" width="22" height="90" fill="rgba(239,68,68,0.2)" stroke="#ef4444" rx="3"/>
    <line x1="83" y1="120" x2="83" y2="240" stroke="#ef4444" stroke-width="1.5"/>

    <rect x="108" y="70" width="22" height="160" fill="url(#barGrad)" rx="3"/>
    <line x1="119" y1="50" x2="119" y2="245" stroke="#10b981" stroke-width="1.5"/>

    <rect x="144" y="50" width="22" height="180" fill="url(#barGrad)" rx="3"/>
