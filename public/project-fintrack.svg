  </defs>

  <rect width="800" height="500" fill="url(#finBg)" rx="16"/>

  <rect x="40" y="40" width="720" height="420" rx="12" fill="#090e17" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="6" fill="#ef4444" />
  <circle cx="92" cy="70" r="6" fill="#f59e0b" />
  <circle cx="114" cy="70" r="6" fill="#10b981" />
