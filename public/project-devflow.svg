<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)" rx="16"/>

  <!-- Code editor mockup -->
  <rect x="40" y="40" width="720" height="420" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="70" cy="70" r="6" fill="#ef4444" />
  <circle cx="92" cy="70" r="6" fill="#f59e0b" />
  <circle cx="114" cy="70" r="6" fill="#10b981" />
  <text x="140" y="74" fill="#94a3b8" font-family="monospace" font-size="12">DevFlow IDE — Workspace AST Indexer &amp; Vector Copilot</text>

  <!-- Left Sidebar -->
  <rect x="40" y="95" width="160" height="365" fill="#0b1120" />
  <text x="55" y="125" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">EXPLORER</text>
  <text x="65" y="155" fill="#cbd5e1" font-family="monospace" font-size="12">&gt; src/engine/</text>
  <text x="80" y="180" fill="#38bdf8" font-family="monospace" font-size="12"># ast_parser.py</text>
  <text x="80" y="205" fill="#94a3b8" font-family="monospace" font-size="12"># vector_store.ts</text>
  <text x="80" y="230" fill="#94a3b8" font-family="monospace" font-size="12"># tokenizer.rs</text>

  <!-- Code area -->
  <text x="230" y="130" fill="#f43f5e" font-family="monospace" font-size="13">async function <tspan fill="#38bdf8">analyzeContextStream</tspan>(repo: ASTGraph) {</text>
  <text x="250" y="160" fill="#94a3b8" font-family="monospace" font-size="13">const embeddings = await vectorEngine.embed(repo.nodes);</text>
  <text x="250" y="190" fill="#a855f7" font-family="monospace" font-size="13">return streamingInference({ query, context: embeddings });</text>
  <text x="230" y="220" fill="#f43f5e" font-family="monospace" font-size="13">}</text>

  <!-- AI Suggestion Bubble -->
  <rect x="230" y="250" width="500" height="180" rx="10" fill="rgba(30,41,59,0.9)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="245" y="265" width="80" height="22" rx="4" fill="#6366f1" />
  <text x="255" y="280" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11">AI INSIGHT</text>
  <text x="340" y="281" fill="#cbd5e1" font-family="sans-serif" font-size="12">Complexity: O(log N) · Vector caching enabled</text>
  <line x1="245" y1="300" x2="715" y2="300" stroke="rgba(255,255,255,0.08)" />
  <text x="245" y="330" fill="#10b981" font-family="sans-serif" font-weight="600" font-size="13">+ Refactored with async parallel tokenization for 3.4x speedup.</text>
  <text x="245" y="360" fill="#94a3b8" font-family="sans-serif" font-size="12">Automated unit test coverage generated: 14 assertions passing.</text>
</svg>
